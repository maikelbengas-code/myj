<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101828">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MyJ">
<title>Gestión MyJ</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
<style>
:root{--bg:#f3f4f7;--card:#fff;--ink:#121a2b;--mut:#6b7385;--line:#e4e7ee;--soft:#eef0f5;--mk:#2f5bea;--jz:#d63d7a;--ok:#0f9d74;--bad:#e5484d;--warn:#e59f0b;--nav:rgba(255,255,255,.92)}
:root[data-theme=dark]{--bg:#0c121d;--card:#151d2c;--ink:#eef1f7;--mut:#8f98ad;--line:#243049;--soft:#1c2638;--mk:#6c8cff;--jz:#ff6fa5;--ok:#2dd4a0;--bad:#ff6b70;--warn:#f5b73b;--nav:rgba(21,29,44,.92)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:Figtree,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--mk);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:8px}
.brand{font-weight:800;font-size:17px;flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.logoimg{width:32px;height:32px;border-radius:9px;flex:none;object-fit:cover}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--mk),var(--jz));color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800}
.ib{width:38px;height:38px;border-radius:11px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--mut);position:relative}
.dot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--warn)}.dot.on{background:var(--ok)}
.bar2{padding:10px 0 0}.bar2 .wrap{display:flex;gap:8px;align-items:center}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;flex:1}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-weight:600;font-size:13px;color:var(--mut);display:flex;gap:6px;justify-content:center;align-items:center}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.mon{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px}
.mon button{width:36px;height:38px;color:var(--mut)}.mon b{min-width:104px;text-align:center;font-size:14px;text-transform:capitalize}
section{display:none;padding-top:14px}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.card h3{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero{padding:20px 18px;border-radius:22px;background:#121a2b;color:#fff;margin-bottom:12px;border:0}
:root[data-theme=dark] .hero{background:#1d2a45}
.hero small{color:#a9b3c9;font-size:13px}.hero .big{font-size:34px;font-weight:800;margin:2px 0 14px}
.hero .big.neg{color:#ff8a8e}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trio div{background:rgba(255,255,255,.08);border-radius:12px;padding:9px 10px}
.trio span{display:block;font-size:11px;color:#a9b3c9}.trio b{font-size:13.5px;display:block;margin-top:1px;white-space:nowrap}
.rule{margin-bottom:14px}.rule:last-child{margin:0}
.rule .r{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;gap:8px}.rule .r span:first-child{font-weight:600}.rule .r span:last-child{color:var(--mut)}
.track{height:9px;background:var(--soft);border-radius:9px;overflow:hidden}.track i{display:block;height:100%;border-radius:9px;transition:width .4s}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
.t-maikel{background:color-mix(in srgb,var(--mk) 14%,transparent);color:var(--mk)}.t-jazmin{background:color-mix(in srgb,var(--jz) 14%,transparent);color:var(--jz)}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0;padding-top:0}
.ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:14px}
.c-needs{background:color-mix(in srgb,var(--mk) 14%,transparent);color:var(--mk)}.c-wants{background:color-mix(in srgb,#8b5cf6 16%,transparent);color:#8b5cf6}.c-savings{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}.c-ant{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.row .m{flex:1;min-width:0}.row .m b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .m small{color:var(--mut);font-size:12px}
.row .a{font-weight:700;font-size:14.5px;white-space:nowrap}
.x{color:var(--mut);padding:8px}.x:hover{color:var(--bad)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--mut)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{text-align:center;color:var(--mut);font-size:13.5px;padding:22px 8px}
.btn{width:100%;padding:13px;border-radius:13px;background:var(--ink);color:var(--bg);font-weight:700}
.btn.sec{background:var(--soft);color:var(--ink)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px}.kpi span{font-size:12px;color:var(--mut)}.kpi b{display:block;font-size:16px;margin-top:2px}
.tw{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:430px}
th{color:var(--mut);font-weight:600;text-align:right;padding:6px 8px;font-size:12px}td{padding:10px 8px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;text-transform:capitalize;font-weight:600;position:sticky;left:0;background:var(--card)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.cc{border-radius:16px;padding:16px;color:#fff;margin-bottom:12px;background:linear-gradient(135deg,#1c2b4d,#2f5bea)}.cc.jazmin{background:linear-gradient(135deg,#4a1d3a,#d63d7a)}
.cc .h{display:flex;justify-content:space-between;align-items:center;font-size:13px}.cc .h>*{opacity:.92}.cc .act{display:flex;gap:6px}.cc .act button{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.18);color:#fff;display:grid;place-items:center;font-size:13px}.cc .act button:hover{background:rgba(255,255,255,.32)}.cc .v{font-size:20px;font-weight:800;margin:10px 0 2px}.cc .track{background:rgba(255,255,255,.22);margin-top:10px}.cc .track i{background:#fff}.cc .track i.hi{background:#ffb3b6}
nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--nav);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .wrap{display:grid;grid-template-columns:1fr 1fr 64px 1fr 1fr;align-items:center;padding:0 6px}
nav button.t{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0;font-size:11px;font-weight:600;color:var(--mut)}nav button.t i{font-size:18px}nav button.t.on{color:var(--ink)}
.fab{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--mk),var(--jz));color:#fff;font-size:20px;margin:-22px auto 0;box-shadow:0 6px 16px rgba(47,91,234,.4)}
.ov{position:fixed;inset:0;z-index:40;background:rgba(8,12,22,.6);display:none;align-items:flex-end;justify-content:center}.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media(min-width:600px){.ov{align-items:center}.sheet{border-radius:22px}}
.sheet h2{font-size:18px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
label{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin:0 0 5px}
.in{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:16px;margin-bottom:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#login{position:fixed;inset:0;z-index:60;background:#0c121d;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;text-align:center}#login.off{display:none}
#login h1{font-size:30px;font-weight:800;margin-bottom:6px}#login p{color:#8f98ad;margin-bottom:26px}
.pf{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:380px}
.pf button{background:#151d2c;border:2px solid #243049;border-radius:20px;padding:22px 10px;color:#fff;font-weight:700;font-size:17px}.pf i{display:block;font-size:34px;margin-bottom:10px}
.pf .mk i{color:#6c8cff}.pf .jz i{color:#ff6fa5}.pf .mk:hover{border-color:#6c8cff}.pf .jz:hover{border-color:#ff6fa5}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="login">
  <img src="logo.png" alt="Maikel y Jazmín" width="170" style="height:auto;margin-bottom:14px">
  <p>¿Quién entra hoy?</p>
  <div class="pf">
    <button class="mk" onclick="selectProfile('maikel')"><i class="fa-solid fa-user-ninja"></i>Maikel</button>
    <button class="jz" onclick="selectProfile('jazmin')"><i class="fa-solid fa-user-astronaut"></i>Jazmín</button>
  </div>
  <small id="login-status" style="margin-top:26px;color:#8f98ad">Modo local</small>
  <small style="margin-top:6px;color:#8f98ad;opacity:.8">Versión <span class="app-ver">3.0.0</span></small>
</div>

<header class="top"><div class="wrap">
  <div class="brand"><img class="logoimg" src="icon-192.png" alt="">Finanzas MyJ</div>
  <button class="ib" onclick="toggleTheme()" aria-label="Cambiar tema"><i id="theme-i" class="fa-solid fa-moon"></i></button>
  <button class="ib" onclick="openModal('m-menu')" aria-label="Menú"><i class="fa-solid fa-ellipsis"></i><span id="fb-dot" class="dot"></span></button>
</div>
<div class="bar2"><div class="wrap">
  <div class="seg">
    <button id="v-ind" onclick="setViewMode('individual')"><i id="v-ico" class="fa-solid fa-user"></i><span id="v-name">Yo</span></button>
    <button id="v-cou" onclick="setViewMode('couple')"><i class="fa-solid fa-heart"></i>En pareja</button>
  </div>
  <div class="mon"><button onclick="shiftMonth(-1)" aria-label="Mes anterior"><i class="fa-solid fa-chevron-left"></i></button><b id="mon-label"></b><button onclick="shiftMonth(1)" aria-label="Mes siguiente"><i class="fa-solid fa-chevron-right"></i></button></div>
</div></div></header>

<main class="wrap">
<!-- RESUMEN -->
<section id="s-home" class="on">
  <div class="card hero">
    <small>Balance del mes</small>
    <div class="big num" id="h-bal">Gs. 0</div>
    <div class="trio">
      <div><span>Ingresos</span><b class="num" id="h-inc">0</b></div>
      <div><span>Gastos</span><b class="num" id="h-exp">0</b></div>
      <div><span>Ahorro</span><b class="num" id="h-sav">0</b></div>
    </div>
  </div>
  <div class="card">
    <h3>Regla 50 / 30 / 20 <button class="tag t-maikel" onclick="openIncome()"><i class="fa-solid fa-pen"></i> Ingresos</button></h3>
    <div id="rules"></div>
  </div>
  <div class="card">
    <h3>Gastos hormiga <span class="tag c-ant" id="ant-badge">Gs. 0/año</span></h3>
    <div id="ant-list"></div>
  </div>
</section>

<!-- MOVIMIENTOS -->
<section id="s-tx">
  <div class="chips" id="tx-chips"></div>
  <div class="card" id="tx-list"></div>
</section>

<!-- COMPARAR -->
<section id="s-cmp">
  <div class="chips" id="rng-chips"></div>
  <div class="kpis" id="cmp-kpis"></div>
  <div class="card"><h3>Ingresos vs. gastos</h3><div style="height:230px"><canvas id="chart"></canvas></div></div>
  <div class="card"><h3>Detalle por mes</h3><div class="tw"><table id="cmp-table"></table></div></div>
</section>

<!-- TARJETAS -->
<section id="s-cards">
  <div id="cards-list"></div>
  <button class="btn sec" onclick="openCard()"><i class="fa-solid fa-plus"></i> Agregar tarjeta</button>
</section>
</main>

<nav><div class="wrap">
  <button class="t on" data-tab="home" onclick="setTab('home')"><i class="fa-solid fa-chart-pie"></i>Resumen</button>
  <button class="t" data-tab="tx" onclick="setTab('tx')"><i class="fa-solid fa-list"></i>Movimientos</button>
  <button class="fab" onclick="openModal('m-tx')" aria-label="Registrar movimiento"><i class="fa-solid fa-plus"></i></button>
  <button class="t" data-tab="cmp" onclick="setTab('cmp')"><i class="fa-solid fa-chart-column"></i>Comparar</button>
  <button class="t" data-tab="cards" onclick="setTab('cards')"><i class="fa-solid fa-credit-card"></i>Tarjetas</button>
</div></nav>

<!-- MODALES -->
<div class="ov" id="m-tx" onclick="if(event.target===this)closeModal('m-tx')"><form class="sheet" onsubmit="handleTransactionSubmit(event)">
  <h2>Nuevo movimiento <button type="button" class="x" onclick="closeModal('m-tx')"><i class="fa-solid fa-xmark"></i></button></h2>
  <label>Concepto</label><input class="in" id="tx-description" required placeholder="Ej. Supermercado">
  <div class="g2"><div><label>Monto (Gs.)</label><input class="in" id="tx-amount" type="number" inputmode="numeric" required placeholder="150000"></div>
  <div><label>Fecha</label><input class="in" id="tx-date" type="date" required></div></div>
  <div class="g2"><div><label>Responsable</label><select class="in" id="tx-owner"><option value="maikel">Maikel</option><option value="jazmin">Jazmín</option></select></div>
  <div><label>Categoría</label><select class="in" id="tx-category"><option value="needs">Necesidad (50%)</option><option value="wants">Deseo (30%)</option><option value="savings">Ahorro (20%)</option><option value="ant">Gasto hormiga</option></select></div></div>
  <button class="btn">Guardar movimiento</button>
</form></div>

<div class="ov" id="m-income" onclick="if(event.target===this)closeModal('m-income')"><form class="sheet" onsubmit="handleIncomeSubmit(event)">
  <h2>Ingresos de <span id="inc-month" style="text-transform:capitalize;margin-left:6px"></span><button type="button" class="x" onclick="closeModal('m-income')"><i class="fa-solid fa-xmark"></i></button></h2>
  <label>Maikel (Gs.)</label><input class="in" id="income-maikel" type="number" inputmode="numeric">
  <label>Jazmín (Gs.)</label><input class="in" id="income-jazmin" type="number" inputmode="numeric">
  <button class="btn">Guardar ingresos del mes</button>
</form></div>

<div class="ov" id="m-card" onclick="if(event.target===this)closeModal('m-card')"><form class="sheet" onsubmit="handleCardSubmit(event)">
  <h2><span id="card-title">Nueva tarjeta</span> <button type="button" class="x" onclick="closeModal('m-card')"><i class="fa-solid fa-xmark"></i></button></h2>
  <input type="hidden" id="card-id"><label>Nombre</label><input class="in" id="card-name" required placeholder="Visa Itaú">
  <label>Titular</label><select class="in" id="card-owner"><option value="maikel">Maikel</option><option value="jazmin">Jazmín</option></select>
  <div class="g2"><div><label>Límite (Gs.)</label><input class="in" id="card-limit" type="number" inputmode="numeric" required></div>
  <div><label>Usado (Gs.)</label><input class="in" id="card-used" type="number" inputmode="numeric" required></div></div>
  <button class="btn" id="card-save">Guardar tarjeta</button>
</form></div>

<div class="ov" id="m-menu" onclick="if(event.target===this)closeModal('m-menu')"><div class="sheet">
  <h2>Ajustes <button type="button" class="x" onclick="closeModal('m-menu')"><i class="fa-solid fa-xmark"></i></button></h2>
  <div class="card" style="background:var(--soft);border:0"><b style="font-size:13px"><i class="fa-solid fa-cloud"></i> Sincronización</b><p id="fb-text" style="font-size:13px;color:var(--mut);margin-top:4px">Modo local.</p></div>
  <button class="btn sec" style="margin-bottom:10px" onclick="reconnectFirebase()"><i class="fa-solid fa-rotate"></i> Reintentar sincronización</button>
  <button class="btn sec" onclick="closeModal('m-menu');showProfileSelection()"><i class="fa-solid fa-right-from-bracket"></i> Cambiar de usuario</button>
  <button class="btn sec" style="margin-top:10px;color:var(--bad)" onclick="resetAll()"><i class="fa-solid fa-trash-can"></i> Borrar todos los datos</button>
  <p style="text-align:center;font-size:12px;color:var(--mut);margin-top:14px">Finanzas M&J · v<span class="app-ver">3.0.0</span></p>
</div></div>

<script>
const APP_VERSION='3.0.0';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const formatGs=n=>'Gs. '+Math.round(n||0).toLocaleString('es-PY');
const short=n=>{const a=Math.abs(n);return (n<0?'-':'')+(a>=1e6?(a/1e6).toFixed(1).replace('.0','')+' M':a>=1e3?Math.round(a/1e3)+' mil':Math.round(a))};
const mKey=d=>new Date(d.getFullYear(),d.getMonth(),1).toLocaleDateString('sv').slice(0,7);
const mLabel=(k,long)=>{const[y,m]=k.split('-');return new Date(+y,+m-1,1).toLocaleDateString('es-PY',long?{month:'long',year:'numeric'}:{month:'short',year:'2-digit'}).replace('.','')};
const addM=(k,n)=>{const[y,m]=k.split('-');return mKey(new Date(+y,+m-1+n,1))};
const CAT={needs:['Necesidad','fa-house','c-needs'],wants:['Deseo','fa-gamepad','c-wants'],savings:['Ahorro','fa-piggy-bank','c-savings'],ant:['Hormiga','fa-bug','c-ant']};
const NAME={maikel:'Maikel',jazmin:'Jazmín'};

// ---- Estado ----
const nowKey=mKey(new Date());
window.appState={activeProfile:'maikel',viewMode:'individual',incomeMaikel:0,incomeJazmin:0,incomes:{},transactions:[],creditCards:[]};
const ui={month:nowKey,tab:'home',range:6,filter:'all'};
const S=()=>window.appState, save=()=>window.saveAppState&&window.saveAppState();

// ---- Datos ----
const inMode=o=>S().viewMode==='couple'||o===S().activeProfile;
function incomeOf(k){const i=S().incomes[k]||{maikel:S().incomeMaikel,jazmin:S().incomeJazmin};
 return S().viewMode==='couple'?(+i.maikel||0)+(+i.jazmin||0):(+i[S().activeProfile]||0)}
function stats(k){const s={inc:incomeOf(k),needs:0,wants:0,ant:0,sav:0};
 S().transactions.forEach(t=>{if(String(t.date).slice(0,7)===k&&inMode(t.owner))s[t.category]+=+t.amount||0});
 s.exp=s.needs+s.wants+s.ant;s.bal=s.inc-s.exp-s.sav;return s}

// ---- UI base ----
function toggleTheme(){const r=document.documentElement,d=r.dataset.theme==='dark';r.dataset.theme=d?'light':'dark';$('theme-i').className='fa-solid '+(d?'fa-moon':'fa-sun');if(ui.tab==='cmp')renderCompare()}
const openModal=id=>{if(id==='m-tx')$('tx-date').value=(ui.month===nowKey?new Date().toLocaleDateString('sv'):ui.month+'-01');$(id).classList.add('on')};
const closeModal=id=>$(id).classList.remove('on');
function openIncome(){const i=S().incomes[ui.month]||{maikel:S().incomeMaikel,jazmin:S().incomeJazmin};
 $('income-maikel').value=i.maikel||'';$('income-jazmin').value=i.jazmin||'';$('inc-month').textContent=mLabel(ui.month,1);openModal('m-income')}
function selectProfile(p){S().activeProfile=p;S().viewMode='individual';$('login').classList.add('off');renderAll()}
const showProfileSelection=()=>$('login').classList.remove('off');
const setViewMode=m=>{S().viewMode=m;renderAll()};
const shiftMonth=n=>{ui.month=addM(ui.month,n);renderAll()};
function setTab(t){ui.tab=t;document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==='s-'+t));
 document.querySelectorAll('nav .t').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));scrollTo(0,0);renderAll()}

// ---- Render ----
function renderAll(){renderHead();
 if(ui.tab==='home')renderHome();else if(ui.tab==='tx')renderTx();else if(ui.tab==='cmp')renderCompare();else renderCards()}
function renderHead(){const p=S().activeProfile;$('v-name').textContent=NAME[p];
 $('v-ico').className='fa-solid '+(p==='maikel'?'fa-user-ninja':'fa-user-astronaut');$('v-ico').style.color=p==='maikel'?'var(--mk)':'var(--jz)';
 $('v-ind').classList.toggle('on',S().viewMode==='individual');$('v-cou').classList.toggle('on',S().viewMode==='couple');
 $('mon-label').textContent=mLabel(ui.month,1)}
function renderHome(){const s=stats(ui.month);
 $('h-bal').textContent=formatGs(s.bal);$('h-bal').classList.toggle('neg',s.bal<0);
 $('h-inc').textContent=short(s.inc);$('h-exp').textContent=short(s.exp);$('h-sav').textContent=short(s.sav);
 const R=[['Necesidades 50%',s.needs,s.inc*.5,'var(--mk)'],['Deseos 30%',s.wants+s.ant,s.inc*.3,'#8b5cf6'],['Ahorro 20%',s.sav,s.inc*.2,'var(--warn)']];
 $('rules').innerHTML=R.map(([n,v,l,c],i)=>{const p=l?v/l*100:0,over=i<2&&p>100;
  return `<div class="rule"><div class="r"><span>${n}</span><span class="num">${formatGs(v)} / ${short(l)}</span></div><div class="track"><i style="width:${Math.min(100,p)}%;background:${over?'var(--bad)':c}"></i></div></div>`}).join('');
 const a=S().transactions.filter(t=>t.category==='ant'&&String(t.date).slice(0,7)===ui.month&&inMode(t.owner));
 const tot=a.reduce((x,t)=>x+(+t.amount||0),0);$('ant-badge').textContent=formatGs(tot*12)+'/año';
 $('ant-list').innerHTML=a.length?a.map(t=>`<div class="row"><div class="ico c-ant"><i class="fa-solid fa-bug"></i></div><div class="m"><b>${esc(t.description)}</b><small>${NAME[t.owner]}</small></div><div class="a num">${formatGs(t.amount)}</div></div>`).join(''):'<div class="empty">Sin gastos hormiga este mes.</div>'}
function renderTx(){
 $('tx-chips').innerHTML=[['all','Todos']].concat(Object.entries(CAT).map(([k,v])=>[k,v[0]])).map(([k,n])=>`<button class="chip ${ui.filter===k?'on':''}" onclick="ui.filter='${k}';renderTx()">${n}</button>`).join('');
 const l=S().transactions.filter(t=>String(t.date).slice(0,7)===ui.month&&inMode(t.owner)&&(ui.filter==='all'||t.category===ui.filter)).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
 $('tx-list').innerHTML=l.length?l.map(t=>{const c=CAT[t.category];
  return `<div class="row"><div class="ico ${c[2]}"><i class="fa-solid ${c[1]}"></i></div><div class="m"><b>${esc(t.description)}</b><small>${String(t.date).slice(8,10)} ${mLabel(String(t.date).slice(0,7))} · ${c[0]} · ${NAME[t.owner]}</small></div><div class="a num">${formatGs(t.amount)}</div><button class="x" onclick="deleteTransaction('${esc(t.id)}')" aria-label="Eliminar"><i class="fa-solid fa-trash"></i></button></div>`}).join(''):'<div class="empty">No hay movimientos en este mes. Toca + para registrar uno.</div>'}
let chart;
function renderCompare(){
 $('rng-chips').innerHTML=[3,6,12].map(n=>`<button class="chip ${ui.range===n?'on':''}" onclick="ui.range=${n};renderCompare()">${n} meses</button>`).join('');
 const ks=Array.from({length:ui.range},(_,i)=>addM(ui.month,i-ui.range+1)),D=ks.map(stats);
 const avg=f=>D.reduce((a,s)=>a+f(s),0)/D.length,best=D.reduce((b,s,i)=>s.bal>D[b].bal?i:b,0);
 $('cmp-kpis').innerHTML=[['Balance promedio',formatGs(avg(s=>s.bal)),avg(s=>s.bal)<0?'neg':'pos'],['Gasto promedio',formatGs(avg(s=>s.exp)),''],['Ahorro promedio',formatGs(avg(s=>s.sav)),''],['Mejor mes',mLabel(ks[best],1),'']].map(([a,b,c])=>`<div class="kpi"><span>${a}</span><b class="num ${c}" style="text-transform:capitalize">${b}</b></div>`).join('');
 const st=getComputedStyle(document.documentElement),col=n=>st.getPropertyValue(n).trim();
 if(chart)chart.destroy();
 chart=new Chart($('chart'),{type:'bar',data:{labels:ks.map(k=>mLabel(k)),datasets:[
  {label:'Ingresos',data:D.map(s=>s.inc),backgroundColor:col('--ok'),borderRadius:5},
  {label:'Gastos',data:D.map(s=>s.exp),backgroundColor:col('--bad'),borderRadius:5},
  {label:'Balance',data:D.map(s=>s.bal),type:'line',borderColor:col('--ink'),backgroundColor:col('--ink'),tension:.3,pointRadius:3}]},
  options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:col('--mut'),boxWidth:10,font:{family:'Figtree'}}},tooltip:{callbacks:{label:c=>c.dataset.label+': '+formatGs(c.raw)}}},
   scales:{x:{ticks:{color:col('--mut')},grid:{display:false}},y:{ticks:{color:col('--mut'),callback:v=>short(v)},grid:{color:col('--line')}}}}});
 const dl=(v,p,inv)=>{if(p==null||!p)return '';const d=v-p;if(!d)return '';const good=inv?d<0:d>0;return `<span class="${good?'pos':'neg'}" style="font-size:11px"> ${d>0?'▲':'▼'}</span>`};
 $('cmp-table').innerHTML=`<tr><th>Mes</th><th>Ingresos</th><th>Gastos</th><th>Ahorro</th><th>Balance</th></tr>`+D.map((s,i)=>{const p=D[i-1];
  return `<tr><td>${mLabel(ks[i])}</td><td class="num">${short(s.inc)}</td><td class="num">${short(s.exp)}${dl(s.exp,p&&p.exp,1)}</td><td class="num">${short(s.sav)}</td><td class="num ${s.bal<0?'neg':'pos'}"><b>${short(s.bal)}</b>${dl(s.bal,p&&p.bal)}</td></tr>`}).join('')}
function renderCards(){const c=S().creditCards.filter(x=>inMode(x.owner));
 $('cards-list').innerHTML=c.length?c.map(x=>{const p=Math.min(100,Math.round((+x.used||0)/(+x.limit||1)*100));
  return `<div class="cc ${x.owner}"><div class="h"><div><b>${esc(x.name)}</b><br><small>${NAME[x.owner]}</small></div><div class="act"><button onclick="openCard('${esc(x.id)}')" aria-label="Editar tarjeta"><i class="fa-solid fa-pen"></i></button><button onclick="deleteCard('${esc(x.id)}')" aria-label="Eliminar tarjeta"><i class="fa-solid fa-trash"></i></button></div></div><div class="v num">${formatGs(x.used)}</div><small>de ${formatGs(x.limit)} · ${p}% usado</small><div class="track"><i class="${p>80?'hi':''}" style="width:${p}%"></i></div></div>`}).join(''):'<div class="card empty">No hay tarjetas en esta vista.</div>'}

// ---- Acciones ----
function handleIncomeSubmit(e){e.preventDefault();S().incomes[ui.month]={maikel:+$('income-maikel').value||0,jazmin:+$('income-jazmin').value||0};save();closeModal('m-income');renderAll()}
function handleTransactionSubmit(e){e.preventDefault();const d=$('tx-date').value;
 S().transactions.unshift({id:Date.now().toString(),description:$('tx-description').value.trim(),amount:+$('tx-amount').value||0,owner:$('tx-owner').value,category:$('tx-category').value,date:d});
 save();e.target.reset();closeModal('m-tx');ui.month=d.slice(0,7);renderAll()}
function openCard(id){const c=id&&S().creditCards.find(x=>x.id===id);
 $('card-id').value=c?c.id:'';$('card-title').textContent=c?'Editar tarjeta':'Nueva tarjeta';$('card-save').textContent=c?'Guardar cambios':'Guardar tarjeta';
 $('card-name').value=c?c.name:'';$('card-owner').value=c?c.owner:S().activeProfile;$('card-limit').value=c?c.limit:'';$('card-used').value=c?c.used:'';openModal('m-card')}
function handleCardSubmit(e){e.preventDefault();const id=$('card-id').value,d={name:$('card-name').value.trim(),owner:$('card-owner').value,limit:+$('card-limit').value||0,used:+$('card-used').value||0};
 if(id)S().creditCards=S().creditCards.map(x=>x.id===id?{...x,...d}:x);else S().creditCards.push({id:'c_'+Date.now(),...d});
 save();closeModal('m-card');renderAll()}
function deleteCard(id){const c=S().creditCards.find(x=>x.id===id);if(!c||!confirm('¿Eliminar la tarjeta "'+c.name+'"?'))return;S().creditCards=S().creditCards.filter(x=>x.id!==id);save();renderAll()}
function deleteTransaction(id){if(!confirm('¿Eliminar este movimiento?'))return;S().transactions=S().transactions.filter(t=>t.id!==id);save();renderAll()}
function resetAll(){if(!confirm('Se borrarán ingresos, movimientos y tarjetas de los dos. ¿Continuar?')||!confirm('Esta acción no se puede deshacer. ¿Seguro?'))return;Object.assign(S(),{incomeMaikel:0,incomeJazmin:0,incomes:{},transactions:[],creditCards:[]});save();closeModal('m-menu');renderAll()}
const reconnectFirebase=()=>{window.initFirebase&&window.initFirebase();closeModal('m-menu')};
addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('.app-ver').forEach(e=>e.textContent=APP_VERSION);renderAll()});
</script>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import{getAuth,signInAnonymously,signInWithCustomToken,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import{getFirestore,doc,onSnapshot,setDoc}from"https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
const appId=typeof __app_id!=='undefined'?__app_id:'maikel-jazmin-finanzas';
const firebaseConfig=typeof __firebase_config!=='undefined'?JSON.parse(__firebase_config):{apiKey:"demo-key",authDomain:"demo.firebaseapp.com",projectId:"demo-project",storageBucket:"demo.appspot.com",messagingSenderId:"000000000",appId:"1:000000000:web:000000000"};
let app,db,auth,ready=false,listening=false;
const ref=()=>doc(db,'artifacts',appId,'public','data','budget_shared');
function status(ok){const d=document.getElementById('fb-dot');d.className='dot'+(ok?' on':'');
 document.getElementById('login-status').textContent=ok?'Sincronizado con Firebase':'Modo local (sin conexión)';
 document.getElementById('fb-text').textContent=ok?'Sincronización en tiempo real activa.':'Modo local. Los cambios no se comparten hasta conectar.'}
async function initFirebase(){try{app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);
 if(typeof __initial_auth_token!=='undefined'&&__initial_auth_token)await signInWithCustomToken(auth,__initial_auth_token);else await signInAnonymously(auth);
 onAuthStateChanged(auth,u=>{if(u){ready=true;status(true);listen()}})}catch(e){console.warn('Modo local:',e);status(false)}}
function listen(){if(listening)return;listening=true;
 onSnapshot(ref(),snap=>{if(snap.exists()){const d=snap.data(),s=window.appState;
  s.incomeMaikel=d.incomeMaikel??s.incomeMaikel;s.incomeJazmin=d.incomeJazmin??s.incomeJazmin;s.incomes=d.incomes??s.incomes;
  s.transactions=d.transactions??s.transactions;s.creditCards=d.creditCards??s.creditCards;renderAll()}else save()},e=>console.error(e))}
async function save(){if(!ready||!db)return;const s=window.appState;
 try{await setDoc(ref(),{incomeMaikel:s.incomeMaikel,incomeJazmin:s.incomeJazmin,incomes:s.incomes,transactions:s.transactions,creditCards:s.creditCards,lastUpdated:new Date().toISOString()},{merge:true})}catch(e){console.error(e)}}
window.saveAppState=save;window.initFirebase=initFirebase;initFirebase();
</script>
<script>if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</body>
